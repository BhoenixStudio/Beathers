name: Create Release

on:
  push:
    branches:
      - release/production

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'release/production'
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📂 Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 💾 Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v1-

      - name: 🔧 Preparing project dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 📦 Get package info
        id: package-info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: 🔃 Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "${{ steps.package-info.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
          echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build project
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          pnpm build:publish

      - name: 📄 Extract latest changelog
        id: changelog
        run: |
          START_LINE=$(grep -n "^## \[v[0-9]*\.[0-9]*\.[0-9]*\]" CHANGELOG | head -1 | cut -d: -f1)

          if [ -z "$START_LINE" ]; then
            echo "No version sections found in CHANGELOG"
            echo "" > changelog_section.md
          else
            NEXT_LINE=$(grep -n "^## \[v[0-9]*\.[0-9]*\.[0-9]*\]" CHANGELOG | sed -n '2p' | cut -d: -f1)

            if [ -z "$NEXT_LINE" ]; then
              sed -n "${START_LINE},\$p" CHANGELOG > changelog_section.md
            else
              END_LINE=$((NEXT_LINE - 1))
              sed -n "${START_LINE},${END_LINE}p" CHANGELOG > changelog_section.md
            fi
          fi

          echo "changelog_file=changelog_section.md" >> $GITHUB_OUTPUT

      - name: 🆕 Create Release
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.package-info.outputs.version }}" \
            --title "Release ${{ steps.package-info.outputs.version }}" \
            --notes-file changelog_section.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔃 Check NPM version
        if: steps.check-tag.outputs.exists == 'false'
        id: check-npm
        run: |
          if npm view ${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }} version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Publish to NPM
        if: steps.check-tag.outputs.exists == 'false' && steps.check-npm.outputs.exists == 'false'
        run: |
          echo "Publishing ${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }} to NPM..."
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: ⏭️ Skip NPM Publish
        if: steps.check-tag.outputs.exists == 'false' && steps.check-npm.outputs.exists == 'true'
        run: |
          echo "::warning::Version ${{ steps.package-info.outputs.version }} already exists on npm. Skipping publish."
      - name: ❌ Skip Actions (Already Exists)
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "::warning::Release ${{ steps.package-info.outputs.version }} already exists. Skipping release creation."

      - name: 📢 Send ClickUp Notification
        if: always()
        uses: architweb/ClickUpNotification@v3.1.0
        with:
          clickup_api_token: ${{ secrets.CLICKUP_API_TOKEN }}
          clickup_workspace_id: ${{ secrets.CLICKUP_WORKSPACE_ID }}
          clickup_channel_id: ${{ secrets.CLICKUP_CHANNEL_ID }}
          clickup_project_name: ${{ secrets.CLICKUP_PROJECT_NAME }}
          title: 'Release ${{ steps.package-info.outputs.version }} Submitted'
          description: |
            **📊 Details:**
            • **Package:** "${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }}"
            • **Workflow status:** ${{ job.status == 'success' && '✅ Success' || job.status == 'failure' && '❌ Failed' || '⚠️ Cancelled' }}
            • **Release status:** ${{ steps.check-tag.outputs.exists == 'true' && '❌ Skipped' || '✅ Created' }}
            • **NPM Publish status:** ${{ steps.check-tag.outputs.exists == 'true' && steps.check-npm.outputs.exists == 'true' && '❌ Skipped' || '✅ Published' }}
