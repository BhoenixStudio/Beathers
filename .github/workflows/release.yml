name: Create Release

on:
  push:
    branches:
      - release/production

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'release/production'
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📂 Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 💾 Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v1-

      - name: 🔧 Preparing project dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: 📦 Get package info
        id: package-info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: 🔃 Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "${{ steps.package-info.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🏗️ Build project
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          pnpm build:publish

      - name: 🆕 Create Release
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.package-info.outputs.version }}" \
            --title "Release ${{ steps.package-info.outputs.version }}" \
            --notes "Check the [CHANGELOG](./CHANGELOG) for detailed information.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Check NPM version and Publish
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          if npm view ${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }} version 2>/dev/null; then
            echo "::warning::Version ${{ steps.package-info.outputs.version }} already exists on npm. Skipping publish."
          else
            echo "Publishing ${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }} to NPM..."
            pnpm publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: ❌ Skip Actions (Already Exists)
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "::warning::Release ${{ steps.package-info.outputs.version }} already exists. Skipping release creation."

      - name: 📢 Send ClickUp Notification
        if: success()
        uses: architweb/ClickUpNotification@v1.5.0
        with:
          clickup_api_token: ${{ secrets.CLICKUP_API_TOKEN }}
          clickup_workspace_id: ${{ secrets.CLICKUP_WORKSPACE_ID }}
          clickup_channel_id: ${{ secrets.CLICKUP_CHANNEL_ID }}
          clickup_project_name: ${{ secrets.CLICKUP_PROJECT_NAME }}
          full_commit_message: 'true'
